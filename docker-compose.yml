services:
  # -------------------------------------------------------------
  # 1. Intent Classification Service (Port 8005)
  # -------------------------------------------------------------
  intent_service:
    build:
      context: .
      dockerfile: services/intent_service/Dockerfile
    container_name: intent_service
    ports:
      - "18005:8005"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    environment:
      - PORT=8005
      - INTENT_MODEL_DIR=/app/artifacts/models/intent
      - INTENT_ROUTING_MODE=${INTENT_ROUTING_MODE:-router}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.xah.io/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai-gpt-oss-20b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; import json; r=urllib.request.urlopen('http://localhost:8005/health'); assert json.load(r)['model_loaded']"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - copilot-net

  # -------------------------------------------------------------
  # 2. Knowledge Retrieval & RAG Service (Port 8002)
  # -------------------------------------------------------------
  rag_service:
    build:
      context: .
      dockerfile: services/rag_service/Dockerfile
      args:
        INSTALL_RAG_MODEL_DEPS: ${INSTALL_RAG_MODEL_DEPS:-false}
    container_name: rag_service
    ports:
      - "18002:8002"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - rag_model_cache:/models/huggingface
    environment:
      - PORT=8002
      - POLICIES_PATH=/app/data/knowledge_base/policies.json
      - INDEX_PATH=/app/artifacts/vector_store/policy_index.pkl
      - RETRIEVAL_METHOD=${RETRIEVAL_METHOD:-bm25}
      - DENSE_EMBEDDING_MODEL=${DENSE_EMBEDDING_MODEL:-keepitreal/vietnamese-sbert}
      - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-base}
      - RETRIEVAL_DEVICE=${RETRIEVAL_DEVICE:-cpu}
      - HF_HOME=/models/huggingface
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.xah.io/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai-gpt-oss-20b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - copilot-net

  # -------------------------------------------------------------
  # 3. Telemetry & Order Service (Port 8003)
  # -------------------------------------------------------------
  telemetry_service:
    build:
      context: .
      dockerfile: services/telemetry_service/Dockerfile
    container_name: telemetry_service
    ports:
      - "18003:8003"
    volumes:
      - ./data:/app/data
      - ./copilot_telemetry.sqlite3:/app/copilot_telemetry.sqlite3
    environment:
      - PORT=8003
      - DB_PATH=/app/copilot_telemetry.sqlite3
      - MOCK_ORDERS_PATH=/app/data/mock_orders.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - copilot-net

  # -------------------------------------------------------------
  # 4. Conversation & Dialogue Orchestrator (Port 8001)
  # -------------------------------------------------------------
  conversation_service:
    build:
      context: .
      dockerfile: services/conversation_service/Dockerfile
    container_name: conversation_service
    ports:
      - "18001:8001"
    environment:
      - PORT=8001
      - INTENT_SERVICE_URL=http://intent_service:8005
      - RAG_SERVICE_URL=http://rag_service:8002
      - TELEMETRY_SERVICE_URL=http://telemetry_service:8003
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.xah.io/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-openai-gpt-oss-20b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    depends_on:
      intent_service:
        condition: service_healthy
      rag_service:
        condition: service_healthy
      telemetry_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - copilot-net

  # -------------------------------------------------------------
  # 5. API Gateway & Ingress Router (Port 8000)
  # -------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    ports:
      - "18000:8000"
    environment:
      - PORT=8000
      - INTENT_CONFIDENCE_THRESHOLD=${INTENT_CONFIDENCE_THRESHOLD:-0.60}
      - INTENT_SERVICE_URL=http://intent_service:8005
      - RAG_SERVICE_URL=http://rag_service:8002
      - TELEMETRY_SERVICE_URL=http://telemetry_service:8003
      - CONVERSATION_SERVICE_URL=http://conversation_service:8001
    depends_on:
      intent_service:
        condition: service_healthy
      rag_service:
        condition: service_healthy
      telemetry_service:
        condition: service_healthy
      conversation_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - copilot-net

  # -------------------------------------------------------------
  # 5. CSKH Workbench UI (Port 8501)
  # -------------------------------------------------------------
  ui_service:
    build:
      context: .
      dockerfile: services/ui_service/Dockerfile
    container_name: ui_service
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - GATEWAY_URL=http://gateway:8000
    depends_on:
      - gateway
    networks:
      - copilot-net

networks:
  copilot-net:
    driver: bridge

volumes:
  rag_model_cache:
