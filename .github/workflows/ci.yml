name: CMU MLIP Quality Assurance & CI Pipeline

on:
  push:
    branches: [ main, Tan, UI, testing ]
  pull_request:
    branches: [ main, Tan, UI, testing ]

jobs:
  backend-qa-and-mlip-gates:
    name: "Layers 1-5 & 7: Python Static, Data, Unit, Load & MLIP Gates"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff httpx

      - name: "Layer 7: Static Code Analysis (Ruff)"
        run: |
          ruff check contracts/ evaluation/ tests/ --select E9,F63,F7,F82

      - name: "Layer 7 & 4: Data Quality, Schema & Contract Tests"
        run: |
          python -m pytest tests/test_data_and_pipeline_quality.py tests/test_contracts_and_isolation.py -v

      - name: "Layer 6 & 5: Unit, Guardrail, RBAC & MLIP Behavioral Tests"
        run: |
          python -m pytest tests/test_guardrails.py tests/test_rbac_step1.py tests/test_policy_audit_rollback.py tests/test_mlip_evaluation.py -v

      - name: "Layer 3, 2 & 1: E2E Sync, Concurrency Load & Production Drift/Shadow Tests"
        run: |
          python -m pytest tests/test_e2e_customer_staff_sync.py tests/test_load_concurrency.py tests/test_production_drift_and_shadow.py -v

  frontend-qa-and-build:
    name: "Layers 6 & 7: Frontend TypeScript, Vitest Unit & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: "Layer 6: Frontend Unit Tests (Vitest)"
        run: npm run test:unit

      - name: "Layer 7: TypeScript Check & Production Bundle Build"
        run: npm run build
